name: Claude coding tasks
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: claude-task-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  code:
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == github.repository_owner &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check Claude authentication
        env:
          CLAUDE_AUTH_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$CLAUDE_AUTH_PRESENT" != "true" ]; then
            echo "::error::Set CLAUDE_CODE_OAUTH_TOKEN in repository Actions secrets first."
            exit 1
          fi
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 12'

name: Claude coding tasks
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: claude-task-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  code:
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == github.repository_owner &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check Claude authentication
        env:
          CLAUDE_AUTH_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$CLAUDE_AUTH_PRESENT" != "true" ]; then
            echo "::error::Set CLAUDE_CODE_OAUTH_TOKEN in repository Actions secrets first."
            exit 1
          fi
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 이슈 작업은 기본적으로 브랜치 push와 PR 링크까지만 하므로, PR 생성 명령 하나만 추가로 허용
          claude_args: |
            --max-turns 12
            --allowedTools "Bash(gh pr create:*)"
            --append-system-prompt "이슈에서 요청한 작업을 커밋·push한 뒤 gh pr create로 main 대상 PR을 직접 만들고, 작업 댓글에 PR 주소를 남긴다. main에 직접 push하거나 병합하지 않는다. .github/workflows는 수정하지 않는다."
